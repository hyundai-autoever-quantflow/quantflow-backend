app:
  test-ui:
    enabled: ${TEST_UI_ENABLED:false}

  oauth2:
    google:
      client-id: ${GOOGLE_WEB_CLIENT_ID}

  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: quantflow
    audience: quantflow-api
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600

  broker:
    encryption-key-base64: ${BROKER_ENCRYPTION_KEY_BASE64:}
    toss:
      base-url: https://openapi.tossinvest.com
      connect-timeout: 3s
      read-timeout: 5s

  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL}

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

spring:
  config:
    import: "optional:file:./.env[.properties]"

  application:
    name: quantflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quantflow_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s


springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operation-sorter: method
    tags-sorter: alpha
    persist-authorization: false

  paths-to-match: /api/v1/**
